<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Type Color</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Type Color</h1>
        <p class="tagline">Click a letter or number to set its color.</p>
      </header>
      <section id="site-row" class="site-row" hidden>
        <label class="toggle">
          <input type="checkbox" id="site-toggle" />
          <span>Recolor on <span id="site-host">this site</span></span>
        </label>
      </section>
      <div id="grid" class="grid" role="group" aria-label="Palette"></div>
      <section id="save-row" class="save-row">
        <span id="save-hint" class="save-hint" hidden>Unsaved changes</span>
        <button id="save" type="button" class="link-button save-button" disabled>Save</button>
      </section>
      <section id="import-panel" class="import-panel" hidden>
        <p class="import-help">Paste palette JSON below.</p>
        <textarea
          id="import-text"
          rows="8"
          spellcheck="false"
          autocomplete="off"
          aria-label="Palette JSON"
        ></textarea>
        <div class="import-actions">
          <button id="import-apply" type="button" class="link-button">Apply</button>
          <button id="import-cancel" type="button" class="link-button">Cancel</button>
        </div>
      </section>
      <footer>
        <button id="import" type="button" class="link-button">Import</button>
        <button id="export" type="button" class="link-button">Export</button>
        <button id="reset" type="button" class="link-button">Reset palette</button>
      </footer>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
