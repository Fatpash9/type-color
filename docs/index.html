<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Type Color — Privacy Policy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=https://www.privacys.app/privacy/type-color" />
    <link rel="canonical" href="https://www.privacys.app/privacy/type-color" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f3f0;
        --fg: #2a2a2a;
        --muted: #6b6b6b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1c;
          --fg: #d9d9d9;
          --muted: #8a8a8a;
        }
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      a {
        color: var(--fg);
      }
      p {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        The Type Color privacy policy has moved to
        <a href="https://www.privacys.app/privacy/type-color">privacys.app/privacy/type-color</a>.
      </p>
    </main>
  </body>
</html>
